[project]
name = "argos-agent"
version = "0.1.1"
description = "Argos — governed terminal coding agent with CodeAct, verify gate, and brokered tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=8.0.0",
    "httpx[socks]>=0.28.1",
    "playwright>=1.60.0",
    "smolagents>=1.26.0",
    "sqlite-vec>=0.1.9",
    "trafilatura>=2.0.0",
]
license = {text = "MIT"}
authors = [
  {name = "tungoldshou", email = "tungoldshou@users.noreply.github.com"},
]
keywords = ["agent", "ai", "cli", "terminal", "codeact", "verifier", "sandbox"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
argos = "argos.__main__:main"
argosd = "argos.daemon.__main__:main"

[project.urls]
Homepage = "https://github.com/tungoldshou/argos"
Repository = "https://github.com/tungoldshou/argos"
Issues = "https://github.com/tungoldshou/argos/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argos"]

[tool.hatch.build.targets.sdist]
include = [
  "argos",
  "README.md",
  "LICENSE",
]
exclude = [
  "*.egg-info",
  ".venv",
]
