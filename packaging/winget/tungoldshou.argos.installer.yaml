# WinGet installer manifest for Argos
# spec §8.1:PackageIdentifier tungoldshou.argos,ManifestType installer,ManifestVersion 1.6.0
PackageIdentifier: tungoldshou.argos
PackageVersion: 0.1.1
PackageLocale: en-US
PackageName: Argos
Publisher: tungoldshou
License: MIT
ShortDescription: The hundred-eyed agent (CodeAct + verify gate + governance)
ManifestType: installer
ManifestVersion: 1.6.0
Installers:
  - Architecture: x64
    InstallerType: zip
    InstallerUrl: https://github.com/tungoldshou/argos/releases/download/v0.1.1/Argos-0.1.1-x86_64-windows.zip
    InstallerSha256: PLACEHOLDER_FROM_BUMP
InstallBehavior:
  Architecture: x64
  FileExtensions: []
  Commands:
    - argos
  InstallModes:
    - silent
  UninstallCommands:
    - cmd: powershell -Command "Remove-Item -Recurse -Force $env:LOCALAPPDATA\\Programs\\Argos"
UpgradeBehavior: install
