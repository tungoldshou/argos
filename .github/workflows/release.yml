name: Binary Release
# Binary assets are manual for now; the public launch path is PyPI/source.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: CI gate (full test suite, Linux + bwrap)
    uses: ./.github/workflows/ci.yml

  build-macos:
    name: Build macOS arm64
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install deps
        run: uv sync
      - name: Build macOS arm64
        env:
          ARGOS_VERSION: ${{ inputs.tag }}
        run: bash packaging/build_arm64.sh
      - name: Pack macOS tarball + sha256
        env:
          ARGOS_VERSION: ${{ inputs.tag }}
        run: |
          VERSION="${ARGOS_VERSION#v}"
          cd dist
          tar czf "Argos-${VERSION}-arm64-mac.tar.gz" -C "Argos.app/.." "Argos.app"
          shasum -a 256 "Argos-${VERSION}-arm64-mac.tar.gz" > "SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/
          if-no-files-found: error

  build-linux:
    name: Build Linux (AppImage/.deb/.rpm)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm fuse wget libfuse2
      - name: Build Linux
        env:
          ARGOS_VERSION: ${{ inputs.tag }}
        run: bash packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error

  build-windows:
    name: Build Windows (.exe/.msi)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Build Windows
        env:
          ARGOS_VERSION: ${{ inputs.tag }}
        run: bash packaging/build_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [test, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
      - name: Generate release asset manifest + final SHA256SUMS
        working-directory: dist
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          : > release-assets.txt
          missing=0
          for asset in \
            "dist-macos/Argos-${VERSION}-arm64-mac.tar.gz" \
            "dist-linux/Argos-${VERSION}-x86_64.AppImage" \
            "dist-linux/argos_${VERSION}_amd64.deb" \
            "dist-linux/argos-${VERSION}-1.x86_64.rpm" \
            "dist-windows/Argos-${VERSION}-x86_64-windows.zip" \
            "dist-windows/Argos-${VERSION}-x86_64.msi.zip"
          do
            if [ -f "$asset" ]; then
              printf '%s\n' "$asset" >> release-assets.txt
            elif [ "$asset" = "dist-windows/Argos-${VERSION}-x86_64.msi.zip" ]; then
              echo "WARN: optional release asset missing: $asset" >&2
            else
              echo "ERROR: required release asset missing: $asset" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          RELEASABLE_ASSETS=$(cat release-assets.txt)
          [ -n "${RELEASABLE_ASSETS:-}" ] || { echo "ERROR: no releasable assets found" >&2; exit 1; }
          while IFS= read -r asset; do
            sha256sum "$asset"
          done < release-assets.txt > SHA256SUMS
          printf '%s\n' SHA256SUMS >> release-assets.txt
      - name: Create GitHub release (gh release create)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ASSETS=$(cat dist/release-assets.txt)
          echo "Release assets:"
          echo "$ASSETS"
          RELEASABLE_ASSETS=$(printf '%s\n' "$ASSETS" | grep -Ev '(^|/)SHA256SUMS$' || true)
          [ -n "${RELEASABLE_ASSETS:-}" ] || { echo "ERROR: no releasable assets found" >&2; exit 1; }
          gh release create "v${VERSION}" \
            --title "Argos v${VERSION}" \
            --generate-notes \
            --repo "${{ github.repository }}" \
            $(printf '%s\n' "$ASSETS" | xargs -I{} echo "dist/{}")
