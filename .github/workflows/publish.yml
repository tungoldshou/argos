name: Publish to PyPI
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: CI gate (full test suite, Linux + bwrap)
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install deps
        run: uv sync
      - name: Clean dist
        run: rm -rf dist
      - name: Build wheel + sdist
        run: uv build
      - name: Verify with twine
        run: uv run --with twine twine check dist/*
      - name: Smoke installed wheel entry points
        run: uv run pytest tests/test_packaging_pypi.py::test_pip_install_wheel_and_run_argos_version -q --no-cov -m slow
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: [test, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        #   with:
        #     password: ${{ secrets.PYPI_API_TOKEN }}
